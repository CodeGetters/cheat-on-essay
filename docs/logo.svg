<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <style>
    .bg { fill: #0f1218; }
    .term-frame { fill: #1a1d23; stroke: #2a2d34; stroke-width: 1; }
    .term-prompt { fill: #64ffda; font-family: 'SF Mono', Menlo, Monaco, monospace; font-size: 16px; }
    .term-cmd { fill: #e6edf3; font-family: 'SF Mono', Menlo, Monaco, monospace; font-size: 16px; }
    .term-title { fill: #ffb454; font-family: 'SF Mono', Menlo, Monaco, monospace; font-size: 28px; font-weight: 700; }
    .term-sub { fill: #7d8590; font-family: 'SF Mono', Menlo, Monaco, monospace; font-size: 13px; }
    .accent { fill: #f85149; }
    .dot-r { fill: #ff5f56; }
    .dot-y { fill: #ffbd2e; }
    .dot-g { fill: #27c93f; }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="200" rx="8"/>
  <rect class="term-frame" x="20" y="20" width="680" height="160" rx="6"/>
  <circle class="dot-r" cx="40" cy="40" r="5"/>
  <circle class="dot-y" cx="56" cy="40" r="5"/>
  <circle class="dot-g" cx="72" cy="40" r="5"/>
  <text class="term-sub" x="350" y="44" text-anchor="middle">cheat-on-essay — 公众号外挂</text>

  <text class="term-title" x="40" y="95">Cheat on Essay</text>
  <text class="term-sub" x="40" y="120">把每一篇推送变成可校准的实验</text>

  <text class="term-prompt" x="40" y="155">$</text>
  <text class="term-cmd" x="58" y="155">初始化 cheat-on-essay</text>
  <text class="accent" x="335" y="155">▌</text>
</svg>
